name: Validar MarketPreço
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
      - name: Instalar dependências
        run: bun install --frozen-lockfile
      - name: TypeScript
        run: bunx tsc --noEmit
      - name: Testes unitários
        run: bun run test
      - name: Build
        run: bun run build
      - name: Verificar recursos locais de mapa e OCR
        run: |
          test -s public/vendor/tesseract/worker.min.js
          for name in tesseract-core tesseract-core-simd tesseract-core-lstm tesseract-core-simd-lstm; do
            test -s "public/vendor/tesseract/${name}.wasm.js"
            test -s "public/vendor/tesseract/${name}.wasm"
          done
          if grep -E 'cdn\\.jsdelivr\\.net|<script[^>]+src' src/lib/maplibre-loader.ts src/components/PriceLabelOCR.tsx; then
            echo "Script de terceiro encontrado na inicialização do mapa/OCR" >&2
            exit 1
          fi
