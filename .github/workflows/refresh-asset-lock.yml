name: Atualizar lockfile de bibliotecas locais
on:
  push:
    branches: ["security/vendor-map-ocr"]
    paths:
      - "package.json"
      - ".github/workflows/refresh-asset-lock.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Resolver versões fixadas e gerar bun.lock
        run: bun install
      - name: Registrar lockfile na ramificação
        run: |
          if ! git diff --quiet -- bun.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "chore(lock): fixar versões de MapLibre e OCR locais"
            git push origin HEAD:security/vendor-map-ocr
          fi
