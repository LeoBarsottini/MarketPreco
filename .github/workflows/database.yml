name: Testar transações PostgreSQL
on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "src/test/sql/**"
      - ".github/workflows/database.yml"
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "src/test/sql/**"
      - ".github/workflows/database.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: marketpreco_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_ephemeral_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d marketpreco_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ci_ephemeral_only
      PGDATABASE: marketpreco_test
    steps:
      - uses: actions/checkout@v4
      - name: Montar esquema isolado
        run: psql -X -v ON_ERROR_STOP=1 -f src/test/sql/cart-setup.sql
      - name: Aplicar migração transacional
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261027190000_atomic_cart.sql
      - name: Validar acesso, idempotência e integridade
        run: psql -X -v ON_ERROR_STOP=1 -f src/test/sql/cart-assertions.sql
      - name: Aplicar migração de denúncias e moderação
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261027193000_price_moderation.sql
      - name: Validar privilégios e bloqueio de preços denunciados
        run: psql -X -v ON_ERROR_STOP=1 -f src/test/sql/moderation-assertions.sql
      - name: Aplicar migração do painel administrativo
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261028080000_admin_console.sql
      - name: Validar acesso administrativo, moderadores e auditoria
        run: psql -X -v ON_ERROR_STOP=1 -f src/test/sql/admin-assertions.sql
      - name: Simular permissões anônimas excessivas históricas
        run: |
          psql -X -v ON_ERROR_STOP=1 -c "GRANT ALL ON TABLE public.profiles, public.user_roles, public.stores, public.products, public.shopping_lists, public.shopping_list_items, public.price_observations, public.price_reports TO anon"
          psql -X -v ON_ERROR_STOP=1 -c "GRANT EXECUTE ON FUNCTION public.has_role(uuid,public.app_role) TO anon"
      - name: Aplicar proteção de dados, embalagens e listas finalizadas
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261028090000_security_hardening.sql
      - name: Conferir revogações e bloqueio de alterações indevidas
        run: psql -X -v ON_ERROR_STOP=1 -f src/test/sql/security-hardening-assertions.sql
      - name: Aplicar proteção contra abuso de contribuições
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261028100000_contribution_limits.sql
      - name: Validar limites por conta e proteção contra falsificação
        run: psql -X -v ON_ERROR_STOP=1 -f src/test/sql/contribution-limits-assertions.sql
